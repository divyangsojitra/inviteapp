name = "invieasy-api"
main = "src/index.ts"
compatibility_date = "2026-09-27"

[vars]
APP_ENV = "development"
FIREBASE_PROJECT_ID = "invitation-c6d26"
CORS_ORIGIN = "http://localhost:3000"
PUBLIC_WEB_BASE_URL = "http://localhost:3000"
REMINDER_BATCH_SIZE = "25"

[triggers]
crons = ["*/15 * * * *"]

# Bindings to add per environment:
# [[r2_buckets]]
# binding = "MEDIA_BUCKET"
# bucket_name = "invieasy-dev-media"
#
# [[hyperdrive]]
# binding = "DB"
# id = "<hyperdrive-id>"
#
# [[queues.producers]]
# binding = "NOTIFICATION_QUEUE"
# queue = "invieasy-dev-notifications"
#
# Secrets to configure per environment:
# - DATABASE_URL or Hyperdrive binding DB
